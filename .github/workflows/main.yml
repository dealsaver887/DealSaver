name: Build DealSaver Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout DealSaver
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor dependencies
        working-directory: dealsaver-android
        run: |
          npm install --package-lock=false --registry=https://registry.npmjs.org --no-audit --no-fund 2>&1 | tee npm-install.log
          exit ${PIPESTATUS[0]}

      - name: Show npm debug log
        if: failure()
        working-directory: dealsaver-android
        run: |
          echo "===== npm install output ====="
          cat npm-install.log || true
          echo "===== npm debug logs ====="
          cat ~/.npm/_logs/*-debug-0.log || true

      - name: Sync Capacitor Android
        working-directory: dealsaver-android
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x dealsaver-android/android/gradlew

      - name: Build Debug APK
        working-directory: dealsaver-android/android
        run: ./gradlew assembleDebug

      - name: Upload DealSaver APK
        uses: actions/upload-artifact@v4
        with:
          name: DealSaver-APK
          path: dealsaver-android/android/app/build/outputs/apk/debug/app-debug.apk
