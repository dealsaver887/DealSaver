name: Build DealSaver Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout DealSaver
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        working-directory: dealsaver-android
        run: npm install

      - name: Sync Capacitor Android
        working-directory: dealsaver-android
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x dealsaver-android/android/gradlew

      - name: Build Debug APK
        working-directory: dealsaver-android/android
        run: ./gradlew assembleDebug

      - name: Upload DealSaver APK
        uses: actions/upload-artifact@v4
        with:
          name: DealSaver-APK
          path: dealsaver-android/android/app/build/outputs/apk/debug/app-debug.apk
