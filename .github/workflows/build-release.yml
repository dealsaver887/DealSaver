name: Build DealSaver Android Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout DealSaver
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor dependencies
        working-directory: dealsaver-android
        run: |
          npm install --package-lock=false --registry=https://registry.npmjs.org --no-audit --no-fund
          npm install -D typescript --package-lock=false --registry=https://registry.npmjs.org --no-audit --no-fund

      - name: Configure ES module support
        working-directory: dealsaver-android
        run: npm pkg set type=module

      - name: Sync Capacitor Android
        working-directory: dealsaver-android
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x dealsaver-android/android/gradlew

      - name: Verify encrypted signing key
        run: |
          test -f dealsaver-release.keystore.gpg

      - name: Decrypt signing keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          gpg --batch \
            --pinentry-mode loopback \
            --passphrase "$KEYSTORE_PASSWORD" \
            --decrypt \
            --output dealsaver-release.keystore \
            dealsaver-release.keystore.gpg

      - name: Verify keystore and signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "Checking keystore..."
          keytool -list \
            -keystore dealsaver-release.keystore \
            -storepass "$KEYSTORE_PASSWORD"

          echo "Checking signing key..."
          keytool -list \
            -keystore dealsaver-release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keypass "$KEY_PASSWORD"

          echo "Keystore and signing key check completed."

      - name: Build Release APK
        working-directory: dealsaver-android/android
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/dealsaver-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload DealSaver Release APK
        uses: actions/upload-artifact@v4
        with:
          name: DealSaver-Release-APK
          path: dealsaver-android/android/app/build/outputs/apk/release/app-release.apk
