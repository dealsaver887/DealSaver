name: Test DealSaver Signing Key

on:
  workflow_dispatch:

jobs:
  test-signing-key:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout DealSaver
        uses: actions/checkout@v4

      - name: Verify encrypted signing key exists
        run: |
          test -f dealsaver-release.keystore.gpg
          echo "Encrypted signing key found."

      - name: Decrypt signing keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          gpg --batch \
            --pinentry-mode loopback \
            --passphrase "$KEYSTORE_PASSWORD" \
            --decrypt \
            --output dealsaver-release.keystore \
            dealsaver-release.keystore.gpg

          echo "Keystore decrypted successfully."

      - name: Test KEY_PASSWORD
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "Testing KEY_PASSWORD..."

          keytool -list \
            -v \
            -keystore dealsaver-release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            >/dev/null

          if keytool -importkeystore \
            -srckeystore dealsaver-release.keystore \
            -srcstoretype JKS \
            -srcstorepass "$KEYSTORE_PASSWORD" \
            -srcalias "$KEY_ALIAS" \
            -srckeypass "$KEY_PASSWORD" \
            -destkeystore /tmp/test-key.p12 \
            -deststoretype PKCS12 \
            -deststorepass "temporary-test-password" \
            -destkeypass "temporary-test-password" \
            -noprompt >/dev/null 2>&1
          then
            echo "======================================"
            echo "SUCCESS: KEY_PASSWORD unlocks the key."
            echo "======================================"
            exit 0
          else
            echo "KEY_PASSWORD did NOT unlock the private key."
          fi

      - name: Test KEYSTORE_PASSWORD as private-key password
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "Testing KEYSTORE_PASSWORD as the private-key password..."

          if keytool -importkeystore \
            -srckeystore dealsaver-release.keystore \
            -srcstoretype JKS \
            -srcstorepass "$KEYSTORE_PASSWORD" \
            -srcalias "$KEY_ALIAS" \
            -srckeypass "$KEYSTORE_PASSWORD" \
            -destkeystore /tmp/test-key2.p12 \
            -deststoretype PKCS12 \
            -deststorepass "temporary-test-password" \
            -destkeypass "temporary-test-password" \
            -noprompt >/dev/null 2>&1
          then
            echo "================================================"
            echo "SUCCESS: KEYSTORE_PASSWORD unlocks the key."
            echo "================================================"
            exit 0
          else
            echo "KEYSTORE_PASSWORD did NOT unlock the private key."
            echo "Neither configured password unlocks the private key."
            exit 1
          fi
