name: Create DealSaver Signing Key

on:
  workflow_dispatch:

jobs:
  create-signing-key:
    runs-on: ubuntu-latest

    steps:
      - name: Create signing keystore
        env:
          SIGNING_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -genkeypair \
            -v \
            -keystore dealsaver-release.keystore \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$SIGNING_PASSWORD" \
            -keypass "$SIGNING_PASSWORD" \
            -dname "CN=DealSaver, OU=DealSaver, O=DealSaver, L=Chicago, ST=Illinois, C=US"

      - name: Verify signing key
        env:
          SIGNING_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -importkeystore \
            -srckeystore dealsaver-release.keystore \
            -srcstoretype JKS \
            -srcstorepass "$SIGNING_PASSWORD" \
            -srcalias "$KEY_ALIAS" \
            -srckeypass "$SIGNING_PASSWORD" \
            -destkeystore /tmp/test-key.p12 \
            -deststoretype PKCS12 \
            -deststorepass "temporary-test-password" \
            -destkeypass "temporary-test-password" \
            -noprompt

          echo "SUCCESS: New signing key verified."

      - name: Encrypt signing keystore
        env:
          SIGNING_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          gpg --batch --yes \
            --pinentry-mode loopback \
            --passphrase "$SIGNING_PASSWORD" \
            --symmetric \
            --cipher-algo AES256 \
            dealsaver-release.keystore

          rm dealsaver-release.keystore

      - name: Upload encrypted signing key
        uses: actions/upload-artifact@v4
        with:
          name: DealSaver-Signing-Key-New
          path: dealsaver-release.keystore.gpg
